name: Deploy Notebook Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JupyterLite
        # jupyterlite-core <0.5 opens these notebooks blank (cell sources fail to load);
        # 0.6+ works (tested with 0.8.x, same as the CM2013 gallery).
        run: |
          pip install \
            "jupyterlite-core>=0.6" \
            "jupyterlite-pyodide-kernel>=0.6" \
            "jupyter_server" \
            nbconvert

      - name: Collect browser-compatible notebooks
        # The list comes from website/notebooks.json ("lite": "full"), the same
        # data the gallery page renders, so the page and the JupyterLite site
        # cannot drift apart.
        run: |
          mkdir -p _lite_contents
          python - <<'PY'
          import json, shutil
          cat = json.load(open("website/notebooks.json"))
          n = 0
          for nb in cat["notebooks"]:
              if nb["lite"] == "full":
                  shutil.copy(nb["file"], f"_lite_contents/{nb['slug']}.ipynb")
                  n += 1
          print(f"Staged {n} notebooks for JupyterLite")
          PY

      - name: Build JupyterLite
        # base-url must match the GitHub Pages path: /REPO_NAME/lite/
        # Change to /lite/ if using a custom domain (e.g. aiinhealthcarebook.com)
        run: |
          jupyter lite build \
            --contents _lite_contents/ \
            --output-dir _site/lite/ \
            --base-url "/${{ github.event.repository.name }}/lite/"

      - name: Export read-only HTML views (saved outputs, not re-executed)
        run: |
          mkdir -p _site/nb
          python - <<'PY'
          import json, subprocess
          cat = json.load(open("website/notebooks.json"))
          for nb in cat["notebooks"]:
              subprocess.run(["jupyter", "nbconvert", "--to", "html", "--template", "lab",
                              "--output-dir", "_site/nb", "--output", nb["slug"], nb["file"]], check=True)
          PY

      - name: Assemble website
        run: |
          cp website/index.html     _site/
          cp website/style.css      _site/
          cp website/notebooks.json _site/
          cp website/favicon.svg    _site/
          cp website/overrides.json _site/lite/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
